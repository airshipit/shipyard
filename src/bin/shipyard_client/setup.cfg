[metadata]
name = shipyard_client
summary = CLI for shipyard
long_description = file: README.md
long_description_content_type = text/markdown
author = The Airship Authors
home-page = https://airship-shipyard.readthedocs.io/

classifier =
    Intended Audience :: Information Technology
    Intended Audience :: System Administrators
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.12

[options]
include_package_data = True
python_requires = >=3.12
packages =
    shipyard_client
    shipyard_client.api_client
    shipyard_client.cli
    shipyard_client.cli.commit
    shipyard_client.cli.control
    shipyard_client.cli.create
    shipyard_client.cli.describe
    shipyard_client.cli.get
    shipyard_client.cli.help
    shipyard_client.cli.logs

[entry_points]
console_scripts =
    shipyard = shipyard_client.cli.commands:shipyard
