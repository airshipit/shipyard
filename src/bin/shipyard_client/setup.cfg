[metadata]
name = shipyard_client
summary = CLI for shipyard
description-file = README.md
author = The Airship Authors
home-page = https://airship-shipyard.readthedocs.io/

classifier =
    Intended Audience :: Information Technology
    Intended Audience :: System Administrators
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.12

[files]
packages =
    shipyard_client
    shipyard_client.api_client
    shipyard_client.cli
    shipyard_client.cli.commit
    shipyard_client.cli.control
    shipyard_client.cli.create
    shipyard_client.cli.describe
    shipyard_client.cli.get
    shipyard_client.cli.help
    shipyard_client.cli.logs

[entry_points]
console_scripts =
    shipyard = shipyard_client.cli.commands:shipyard
