[metadata]
name = shipyard_airflow
summary = Directed acyclic graph controller for Kubernetes and OpenStack control plane life cycle management
long_description = file: README.rst
long_description_content_type = text/x-rst
author = The Airship Authors
home-page = https://airship-shipyard.readthedocs.io/

classifier =
    Intended Audience :: Information Technology
    Intended Audience :: System Administrators
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.12

[options]
include_package_data = True
python_requires = >=3.12
packages =
    shipyard_airflow
    shipyard_airflow.api
    shipyard_airflow.common
    shipyard_airflow.common.deployment_group
    shipyard_airflow.common.document_validators
    shipyard_airflow.common.notes
    shipyard_airflow.conf
    shipyard_airflow.control
    shipyard_airflow.control.action
    shipyard_airflow.control.af_monitoring
    shipyard_airflow.control.configdocs
    shipyard_airflow.control.helpers
    shipyard_airflow.control.logging
    shipyard_airflow.control.middleware
    shipyard_airflow.control.notes
    shipyard_airflow.control.status
    shipyard_airflow.control.util
    shipyard_airflow.control.validators
    shipyard_airflow.dags
    shipyard_airflow.db
    shipyard_airflow.plugins

[options.package_data]
shipyard_airflow =
    schemas/*.yaml

[entry_points]
oslo.config.opts =
    shipyard_api = shipyard_airflow.conf.opts:list_opts

oslo.policy.policies =
    shipyard_api = shipyard_airflow.policy:list_policies

console_scripts =
    upgrade_db = shipyard_airflow.shipyard_upgrade_db:upgrade_db
